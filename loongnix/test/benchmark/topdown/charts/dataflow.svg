<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">HWGC dataflow</title>
<desc id="desc">Conceptual flow diagram; this is an architecture aid, not a measured timing chart.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="28.00" y="34.00" font-family="Arial, sans-serif" font-size="22px" font-weight="700" fill="#17202A" text-anchor="start">HWGC dataflow</text>
<text x="28.00" y="52.00" font-family="Arial, sans-serif" font-size="12px" font-weight="400" fill="#52606D" text-anchor="start">Conceptual flow diagram; this is an architecture aid, not a measured timing chart.</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606D"/></marker></defs>
<rect x="100" y="180" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/>
<text x="190.00" y="217.00" font-family="Arial, sans-serif" font-size="15px" font-weight="700" fill="#17202A" text-anchor="middle">Mutator / roots</text>
<rect x="390" y="180" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
<text x="480.00" y="217.00" font-family="Arial, sans-serif" font-size="15px" font-weight="700" fill="#17202A" text-anchor="middle">Work queue</text>
<rect x="680" y="180" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/>
<text x="770.00" y="217.00" font-family="Arial, sans-serif" font-size="15px" font-weight="700" fill="#17202A" text-anchor="middle">Trace + copy</text>
<rect x="390" y="360" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="3"/>
<text x="480.00" y="397.00" font-family="Arial, sans-serif" font-size="15px" font-weight="700" fill="#17202A" text-anchor="middle">Survivor space</text>
<line x1="280" y1="211" x2="390" y2="211" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335.00" y="204.00" font-family="Arial, sans-serif" font-size="11px" font-weight="400" fill="#52606D" text-anchor="middle">enqueue</text>
<line x1="570" y1="211" x2="680" y2="211" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625.00" y="204.00" font-family="Arial, sans-serif" font-size="11px" font-weight="400" fill="#52606D" text-anchor="middle">dequeue</text>
<line x1="480" y1="242" x2="480" y2="360" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480.00" y="294.00" font-family="Arial, sans-serif" font-size="11px" font-weight="400" fill="#52606D" text-anchor="middle">copy result</text>
<line x1="680" y1="242" x2="570" y2="391" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625.00" y="309.50" font-family="Arial, sans-serif" font-size="11px" font-weight="400" fill="#52606D" text-anchor="middle">forward</text>
<line x1="390" y1="391" x2="280" y2="242" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335.00" y="309.50" font-family="Arial, sans-serif" font-size="11px" font-weight="400" fill="#52606D" text-anchor="middle">ref update</text>
<text x="480.00" y="500.00" font-family="Arial, sans-serif" font-size="14px" font-weight="700" fill="#6B7280" text-anchor="middle">Measured queue depth / bandwidth: unavailable in parsed CSV</text>
</svg>
